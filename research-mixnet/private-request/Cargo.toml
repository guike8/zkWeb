[package]
name = "zkweb-private"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
tfhe = { version = "=1.8.2", default-features = false, features = ["integer", "zk-pok"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 2
debug = 0

[profile.release]
debug = 0
lto = false
codegen-units = 16
