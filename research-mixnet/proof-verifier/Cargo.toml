[package]
name = "zkweb-tlsn-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-or-later"

# This optional verifier is independent from the legacy zkAPI Rust workspace.
[workspace]

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }

[dev-dependencies]
bincode = "1.3"
rand = "0.9"
rangeset = "0.4"
sha2 = "0.10"
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["fixtures"] }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["fixtures"] }
tlsn-data-fixtures = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
